<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>少年培力園 活動報名</title>
<meta name="description" content="少年培力園活動報名系統。報名過一次，之後只要姓名、身分證、生日就能快速報名。">
<link rel="stylesheet" href="/assets/style.css">
<link rel="icon" type="image/png" href="/assets/favicon.png">
</head>
<body>

<header class="site-header">
  <div class="wrap bar">
    <a class="brand" href="/">
      <span class="mark" aria-hidden="true">🌱</span>
      <span>少年培力園 活動報名</span>
    </a>
    <nav class="site-nav">
      <a href="/" aria-current="page">最新活動</a>
      <a href="/my">查詢我的報名</a>
      <a href="/past">過往活動</a>
      <a href="/admin">後台</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>報名參加培力園的活動</h1>
    <p>選一個你有興趣的活動，點進去就可以報名。<strong>報名過一次之後</strong>，下次只要填姓名、身分證字號、出生年月日就能快速報名。</p>
  </div>

  <div id="notice" class="notice notice-error" hidden></div>

  <h2 class="section-title">開放報名中</h2>
  <div id="upcoming" class="activity-list"><p class="loading">載入中…</p></div>

  <!-- 活動日期還沒到，但已經截止報名或額滿，不該混在開放報名區裡 -->
  <section id="closed-section" hidden>
    <h2 class="section-title">已截止報名／額滿</h2>
    <p class="help" style="margin:-6px 0 12px">
      這些活動還沒舉行，但已經不能報名了。下次記得早點來喔！
    </p>
    <div id="closed" class="activity-list"></div>
  </section>

</main>

<footer class="site-footer">
  <div class="wrap">
    <p>少年培力園｜新北市泰山區明志路一段350號｜洽詢電話 02-2297-7113｜LINE ID：pilot.cafe</p>
    <p class="footer-org">新北市政府社會局委託社團法人中華民國更生少年關懷協會辦理</p>
  </div>
</footer>

<script type="module" src="/assets/home.js"></script>
</body>
</html>
